cell_lines:
  K562:
    hic_url: https://www.encodeproject.org/files/ENCFF291JZM/@@download/ENCFF291JZM.hic
    ctcf_url: https://www.encodeproject.org/files/ENCFF000YMA/@@download/ENCFF000YMA.bigWig
    h3k27ac_url: https://www.encodeproject.org/files/ENCFF779QTH/@@download/ENCFF779QTH.bigWig
    dnase_url: https://www.encodeproject.org/files/ENCFF414OGC/@@download/ENCFF414OGC.bigWig
    loop_source: geo_hiccups_hg19
    loop_url: https://ftp.ncbi.nlm.nih.gov/geo/series/GSE63nnn/GSE63525/suppl/GSE63525%5FK562%5FHiCCUPS%5Flooplist%2Etxt%2Egz
    loop_filename: GSE63525_K562_HiCCUPS_looplist.txt.gz

  HepG2:
    hic_url: https://www.encodeproject.org/files/ENCFF020DPP/@@download/ENCFF020DPP.hic
    ctcf_url: https://www.encodeproject.org/files/ENCFF266BGZ/@@download/ENCFF266BGZ.bigWig
    h3k27ac_url: https://www.encodeproject.org/files/ENCFF084DIM/@@download/ENCFF084DIM.bigWig
    dnase_url: https://www.encodeproject.org/files/ENCFF938OBZ/@@download/ENCFF938OBZ.bigWig
    loop_source: encode_bedpe_hg38
    loop_url: https://www.encodeproject.org/files/ENCFF050EKS/@@download/ENCFF050EKS.bedpe.gz
    loop_filename: ENCFF050EKS.bedpe.gz

liftover:
  chain_filename: hg19ToHg38.over.chain.gz

experiment:
  bin_size: 5000          # 5kb — confirmed usable by diagnose_resolution.py
  window_size: 500000     # 500kb window -> 100x100 output at 5kb
  jitter: 50000           # ±50kb jitter (10% of window, was ±20kb at 1kb)
  train_loops_per_cell_line: 1000
  test_loops_per_cell_line: 25
  train_chroms: [chr1, chr2, chr3, chr8]
  test_chroms: [chr17]
  seed: 42

training:
  batch_size: 32
  lr: 1e-3
  weight_decay: 1e-5
  epochs:
    cnn: 100
    unet: 100
    transformer: 100
  early_stopping_patience: 10
  transformer_warmup_steps: 600
  transformer_grad_clip_norm: 0.5
  transformer_dropout: 0.3
  transformer_weight_decay: 1e-3
  # Target representation
  target: oe              # "oe" = O/E (distance-corrected log1p deviation)
                          # The distance mean at each |i-j| band is subtracted
                          # from log1p(counts), leaving only loop/TAD structure.
                          # Model output is unconstrained signed (no softplus).
  huber_delta: 0.5        # Tighter than raw log1p (was 1.0): O/E values cluster
                          # in [-0.3, +0.3] for background, +0.5 to +2.0 for loops.